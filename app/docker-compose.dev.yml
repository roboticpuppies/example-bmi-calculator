services:
  app:
    # same Node.js major version as the Lambda runtime (nodejs24.x)
    image: node:24-alpine
    working_dir: /usr/app
    command: sh -c "npm ci && node --watch index.js"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
    ports:
      - 8080:8080
    volumes:
      - .:/usr/app
      - /usr/app/node_modules
