version: '3'
services:
  app:
    image: roboticpuppies/bmi-calculator:1.0.${BITBUCKET_BUILD_NUMBER}
    environment:
      - NEW_RELIC_APP_NAME="BMI Calculator"
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
    ports:
      - 80:8080
    logging:
      driver: "syslog"
      options:
        syslog-format: rfc5424
        syslog-address: "tcp+tls://logs5.papertrailapp.com:11115"